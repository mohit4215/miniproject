services:
  - type: web
    name: studypartner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEV_AUTH
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.0"
