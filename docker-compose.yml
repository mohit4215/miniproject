services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studypartner
      POSTGRES_PASSWORD: studypartner
      POSTGRES_DB: studypartner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypartner"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://studypartner:studypartner@db:5432/studypartner
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
